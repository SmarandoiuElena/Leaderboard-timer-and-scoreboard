<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panou arbitru · Acadnet</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/arbitru.css">
</head>
<body data-proba="1">
  <header class="site-header">
    <div class="brand">AcadNet <span>· Panou arbitru</span></div>
    <span id="conn" class="conn"></span>
  </header>

  <main class="panel">
    <!-- stanga: proba, echipa, tabel de scor -->
    <div class="col">
      <section class="card">
        <div class="seg">
          <button class="seg-btn" data-proba="1">Proba 1<small>Viteză</small></button>
          <button class="seg-btn" data-proba="2">Proba 2<small>Control</small></button>
        </div>
      </section>

      <section class="card">
        <span class="lbl">Echipă</span>
        <div class="dd">
          <button type="button" class="dd-btn" id="ddBtn"><span class="ph">Alege echipa…</span></button>
          <ul class="dd-list" id="ddList" hidden></ul>
        </div>
      </section>

      <section class="card">
        <div class="form-p1">
          <span class="lbl">Checkpoint-uri trecute (10 p fiecare)</span>
          <div class="cps">
            <button type="button" class="cp">CP1<small>+10</small></button>
            <button type="button" class="cp">CP2<small>+10</small></button>
            <button type="button" class="cp">CP3<small>+10</small></button>
            <button type="button" class="cp">CP4<small>+10</small></button>
            <button type="button" class="cp">CP5<small>+10</small></button>
          </div>
          <label class="lbl" for="p1speed">Punctaj viteză (0–50)</label>
          <input id="p1speed" type="number" min="0" max="50" step="any" inputmode="decimal" placeholder="0–50">
        </div>

        <div class="form-p2">
          <label class="lbl" for="p2control">Punctaj control</label>
          <input id="p2control" type="number" min="0" step="any" inputmode="decimal" placeholder="Puncte">
          <label class="lbl" for="p2speed">Punctaj viteză (grosime linie)</label>
          <input id="p2speed" type="number" min="0" step="any" inputmode="decimal" placeholder="Puncte">
        </div>

        <div class="total"><span>Total</span><b id="total">0</b></div>
        <button class="btn primary" id="saveBtn">Salvează încercarea</button>
      </section>
    </div>

    <!-- dreapta: timer si ultimele incercari -->
    <div class="col">
      <section class="card">
        <div id="clock" class="mini-clock stopped">00:00.0</div>
        <div class="row3">
          <button class="btn primary" id="start">Start</button>
          <button class="btn warn" id="pause">Pauză</button>
          <button class="btn danger" id="reset">Reset</button>
        </div>
      </section>

      <section class="card">
        <h2 id="recentTitle">Ultimele încercări</h2>
        <ul class="recent" id="recent"></ul>
      </section>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/arbitru.js"></script>
</body>
</html>
